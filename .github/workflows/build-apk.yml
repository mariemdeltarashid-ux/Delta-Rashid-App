name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir app
          cd app

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          mkdir -p www
          cp -R ../web/. www/

          npx cap init "دلتا رشيد" "com.eldelta.rashid" --web-dir www
          npx cap add android

          cd android

          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' variables.gradle || true

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Delta-Rashid-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
