name: Build Delta Rashid APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          mkdir -p web
          unzip -o *.zip -d web

          # If the ZIP contains a single folder, use its contents
          if [ ! -f web/index.html ]; then
            INDEX=$(find web -name index.html -type f | head -1)
            if [ -n "$INDEX" ]; then
              ROOT=$(dirname "$INDEX")
              mkdir -p web2
              cp -R "$ROOT"/. web2/
              rm -rf web
              mv web2 web
            fi
          fi

          test -f web/index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Capacitor project
        run: |
          mkdir app
          cd app

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          mkdir -p www
          cp -R ../web/. www/

          npx cap init "دلتا رشيد" "com.eldelta.rashid" --web-dir www
          npx cap add android

          cd android

          # Target Android 16 / API 36
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' variables.gradle || true

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Delta-Rashid-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
